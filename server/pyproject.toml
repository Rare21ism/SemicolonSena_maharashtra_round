[project]
name = "roundtable-server"
version = "0.1.0"
description = "Roundtable real-time ad-hoc microphone array and live caption server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
ml = [
    "sherpa-onnx>=1.10.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "jiwer>=3.0.3",
    "silero-vad>=5.1.0",
    "onnxruntime>=1.17.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roundtable"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
